name: Build Vista PKEY2005 Research EXEs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'vista_pkey2005_research.py'
      - 'vista_pkey2005_crypto_audit.py'
      - 'vista_pkey2005_public_arithmetic_audit.py'
      - 'vista_phone_activation_assistant.py'
      - '.github/workflows/build-vista-pkey-research.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.7.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.7.9'

      - name: Install Vista-era PyInstaller
        run: python -m pip install --upgrade pip==23.1.2
      - run: python -m pip install pyinstaller==3.6

      - name: Run public arithmetic self-tests
        run: python vista_pkey2005_public_arithmetic_audit.py --self-test

      - name: Build standalone executables
        shell: pwsh
        run: |
          pyinstaller --clean --onefile --console --name VistaPKEY2005-Inspector vista_pkey2005_research.py
          if ($LASTEXITCODE -ne 0) { throw 'Inspector build failed' }
          pyinstaller --clean --onefile --console --name VistaPKEY2005-CryptoAudit vista_pkey2005_crypto_audit.py
          if ($LASTEXITCODE -ne 0) { throw 'Crypto audit build failed' }
          pyinstaller --clean --onefile --console --name VistaPKEY2005-PublicArithmetic vista_pkey2005_public_arithmetic_audit.py
          if ($LASTEXITCODE -ne 0) { throw 'Public arithmetic audit build failed' }
          pyinstaller --clean --onefile --windowed --name VistaPhoneActivationAssistant vista_phone_activation_assistant.py
          if ($LASTEXITCODE -ne 0) { throw 'Phone activation assistant build failed' }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/VistaPKEY2005-Inspector.exe release/
          Copy-Item dist/VistaPKEY2005-CryptoAudit.exe release/
          Copy-Item dist/VistaPKEY2005-PublicArithmetic.exe release/
          Copy-Item dist/VistaPhoneActivationAssistant.exe release/
          @'
          Vista PKEY2005 Research Tools and Phone Activation Assistant
          ============================

          These are standalone command-line research utilities.
          They inspect public configuration data only. PublicArithmetic checks
          all 14 compressed points on the documented K3 twist and checks the
          stored pairing element's subgroup-order relation in K6.
          They do not generate
          product keys, recover signing secrets, verify Microsoft's complete
          PKEY2005 signatures, or activate Windows.

          VistaPhoneActivationAssistant.exe launches the built-in slui.exe 4
          phone activation wizard and formats/copies a 63-digit IID and a
          48-digit CID. It does not generate, obtain, authenticate, or submit
          a CID. A CID must be supplied through Microsoft's supported channel.

          Vista compatibility is targeted using Python 3.7.9 and PyInstaller
          3.6, but must still be tested on the actual Vista SP2 computer.
          If Vista reports a missing runtime or refuses to launch, report the
          exact error; do not assume compatibility from a successful build.

          Usage examples:
            VistaPKEY2005-Inspector.exe pkeyconfig.xrm-ms -o report.json
            VistaPKEY2005-CryptoAudit.exe pkeyconfig.xrm-ms -o crypto-report.json
            VistaPKEY2005-PublicArithmetic.exe pkeyconfig.xrm-ms -o arithmetic-report.json
            VistaPKEY2005-PublicArithmetic.exe --self-test

          Run from Command Prompt in the folder containing the EXEs and config.
          '@ | Set-Content -Encoding ASCII release/README.txt

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VistaPKEY2005-Research-x64
          path: release/*
          if-no-files-found: error
